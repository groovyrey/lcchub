name: portal_app
description: "LCC Hub Student Portal"
publish_to: 'none'
version: 1.3.1+8

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.0
  provider: ^6.1.0
  google_fonts: ^6.2.0
  markdown_widget: ^2.3.2
  flutter_highlight: ^0.7.0
  flutter_math_fork: ^0.7.3
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.0
  intl: ^0.20.0
  permission_handler: ^12.0.3
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  image_picker: ^1.2.1
  phosphor_flutter: ^2.0.2
  connectivity_plus: ^6.1.0
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
